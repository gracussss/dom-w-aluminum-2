    <meta property="og:type" content="website" />

    <meta property="og:locale" content="pl_PL" />

    <!--
      Kroje pisma stoją na własnej domenie (public/fonts). Nie ma tu żadnego
      połączenia z fonts.googleapis.com: arkusz z obcego serwera blokował
      renderowanie i przekazywał Google adres IP każdego odwiedzającego,
      zanim ten cokolwiek kliknął. Definicje @font-face: src/fonts.css.

      Wstępnie pobieramy wyłącznie krój nagłówków w wadze 600 — to on
      rysuje pierwszy ekran. Reszta wag dociąga się normalnie.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-600-normal-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
